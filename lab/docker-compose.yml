# CONTROLFORGE self-validation lab.
#
# Every published port is bound to 127.0.0.1 ONLY - nothing in this lab is
# reachable from outside this host. Each core service has a healthcheck so
# `docker compose up -d --wait` blocks until the lab is actually serving.
#
# Core lab:   docker compose -f docker-compose.yml up -d --wait
# + Juice Shop (optional profile):
#             docker compose -f docker-compose.yml --profile juice up -d --wait
name: controlforge-lab

networks:
  controlforge-lab:
    name: controlforge-lab
    driver: bridge

services:
  lab-headers:
    build: ./targets/headers
    image: controlforge-lab/lab-headers:latest
    container_name: controlforge-lab-headers
    networks:
      - controlforge-lab
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  lab-weaktls:
    build: ./targets/weaktls
    image: controlforge-lab/lab-weaktls:latest
    container_name: controlforge-lab-weaktls
    networks:
      - controlforge-lab
    ports:
      - "127.0.0.1:8443:443"
    healthcheck:
      # TCP probe on 443 + nginx master alive. (No TLS client exists in
      # nginx:alpine; busybox wget cannot skip self-signed cert checks.)
      test: ["CMD-SHELL", "pgrep nginx >/dev/null && nc -w 2 127.0.0.1 443 </dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  lab-webapp:
    build: ./targets/webapp
    image: controlforge-lab/lab-webapp:latest
    container_name: controlforge-lab-webapp
    networks:
      - controlforge-lab
    ports:
      - "127.0.0.1:8082:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  lab-api:
    build: ./targets/api
    image: controlforge-lab/lab-api:latest
    container_name: controlforge-lab-api
    networks:
      - controlforge-lab
    ports:
      - "127.0.0.1:8083:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  lab-ssh:
    build: ./targets/ssh
    image: controlforge-lab/lab-ssh:latest
    container_name: controlforge-lab-ssh
    networks:
      - controlforge-lab
    ports:
      - "127.0.0.1:2222:22"
    healthcheck:
      # TCP connect probe against sshd via busybox nc.
      test: ["CMD-SHELL", "nc -w 2 127.0.0.1 22 </dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Optional OWASP Juice Shop target, kept behind a profile so the core lab
  # starts without it. Start with: --profile juice
  juice-shop:
    image: bkimminich/juice-shop
    container_name: controlforge-lab-juice-shop
    networks:
      - controlforge-lab
    profiles: ["juice"]
    ports:
      - "127.0.0.1:8084:3000"
    healthcheck:
      # The juice-shop image is distroless: no shell, and node is NOT on
      # PATH. Use the absolute interpreter path from the image entrypoint.
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
