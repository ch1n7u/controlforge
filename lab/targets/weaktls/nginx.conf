# CONTROLFORGE lab target: lab-weaktls
# Deliberately weak TLS endpoint:
#   * self-signed cert generated at image build time (RSA-1024, 2-day validity)
#   * obsolete protocol versions enabled: TLSv1 / TLSv1.1 / TLSv1.2
#   * deliberately weak cipher list (3DES / RC4 / NULL entries) at SECLEVEL 0
#   * no Strict-Transport-Security header
# Observed by testssl.sh (protocols, ciphers, certificate) and nmap
# (ssl-enum-ciphers, ssl-cert).
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name lab-weaktls.local;

    server_tokens on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Deliberately obsolete protocol versions.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # Deliberately weak cipher list. @SECLEVEL=0 permits the legacy
    # algorithms; the OpenSSL legacy provider is activated through
    # OPENSSL_CONF (see /etc/nginx/openssl-weak.cnf) so RC4 entries are
    # selectable where OpenSSL still provides them. Verify with
    # `openssl s_client` / `nmap --script ssl-enum-ciphers` what actually
    # negotiates.
    ssl_ciphers "AES128-SHA:AES256-SHA:DES-CBC3-SHA:RC4-SHA:RC4-MD5:NULL-SHA:NULL-MD5:@SECLEVEL=0";
    ssl_prefer_server_ciphers on;

    root  /usr/share/nginx/html;
    index index.html;

    location / { }

    # Deliberately no Strict-Transport-Security header.
}
