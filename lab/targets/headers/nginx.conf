# CONTROLFORGE lab target: lab-headers
# Deliberately insecure HTTP response posture:
#   * no Strict-Transport-Security / X-Content-Type-Options / X-Frame-Options
#     / Content-Security-Policy / Referrer-Policy
#   * version-leaking Server banner (server_tokens on)
#   * directory listing enabled under /files/
#   * plain HTTP only, no redirect to HTTPS
# Observed by the http-headers probe, the http-path-exposure probe and nuclei.
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name lab-headers.local;

    # Version leak: "Server: nginx/1.31.6" is advertised.
    server_tokens on;

    root  /usr/share/nginx/html;
    index index.html;

    # Deliberate exposure: browsable directory listing.
    location /files/ {
        autoindex on;
        autoindex_localtime on;
    }

    # Deliberately no security headers are added anywhere in this vhost,
    # and there is no HTTPS listener or redirect.
}
